<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - {{ script_name }}</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 20px 0;
        }
        pre {
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            width: 80%;
            height: 70vh;
            overflow-y: scroll;
            border: 1px solid #333;
        }
        a {
            color: #00bcd4;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function fetchLogs() {
            fetch(window.location.href)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data, 'text/html');
                    const logContent = doc.querySelector('#log-content').textContent;
                    document.getElementById('log-content').textContent = logContent;
                });
        }
        setInterval(fetchLogs, 500); // Update logs every 2 seconds
    </script>
</head>
<body>
    <h1>Logs for {{ script_name }}</h1>
    <pre id="log-content">{{ log_content }}</pre>
    <a href="/">Back to Home</a>
</body>
</html>
